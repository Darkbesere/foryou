<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-light: #fceabb; 
            --accent-glow: #ff9a9e; 
            --bg-deep: #0b0c10; 
            --glass-bg: rgba(20, 20, 30, 0.4);
        }

        html {
            scroll-behavior: smooth; /* Плавный скролл всей страницы */
        }

        body {
            margin: 0;
            padding: 0;
            /* Фон зафиксирован, чтобы при скролле космос стоял на месте */
            background: radial-gradient(ellipse at bottom, #1b2735 0%, var(--bg-deep) 100%);
            background-attachment: fixed; 
            display: flex;
            justify-content: center;
            min-height: 100vh; 
            overflow-x: hidden; 
            overflow-y: auto; /* Включаем возможность листать */
            font-family: 'Montserrat', sans-serif; 
            color: #fff;
        }

        /* --- ЗВЕЗДНЫЙ ФОН И ПАДАЮЩИЕ ЗВЕЗДЫ --- */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            box-shadow: 0 0 5px #fff, 0 0 10px var(--primary-light);
        }

        .shooting-star {
            position: absolute;
            width: 150px;
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,1));
            transform: rotate(-35deg);
            opacity: 0;
            animation: shooting 7s linear infinite;
        }

        @keyframes shooting {
            0% { transform: translateX(100vw) translateY(-50vh) rotate(-35deg); opacity: 1; }
            5% { transform: translateX(-50vw) translateY(100vh) rotate(-35deg); opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8) translateY(0); }
            100% { opacity: 1; transform: scale(1.2) translateY(-10px); }
        }

        /* --- СТАРТОВЫЙ ЭКРАН --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, #181924 0%, var(--bg-deep) 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            transition: opacity 2s ease-in-out, visibility 2s;
        }

        .intro-text {
            color: var(--primary-light);
            font-size: 1.8rem;
            margin-bottom: 50px;
            text-shadow: 0 0 20px rgba(252, 234, 187, 0.5);
            max-width: 700px;
            line-height: 1.6;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 600;
            opacity: 0;
            animation: fadeIn 2.5s forwards 0.5s;
        }

        .start-btn {
            background-color: transparent;
            color: var(--primary-light);
            border: 1px solid rgba(252, 234, 187, 0.4);
            padding: 15px 50px;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.5s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0;
            animation: fadeIn 2s forwards 2s;
            position: relative;
            overflow: hidden;
        }

        .start-btn:hover {
            background-color: rgba(252, 234, 187, 0.1);
            color: #fff;
            box-shadow: 0 0 25px rgba(252, 234, 187, 0.3);
            border-color: var(--primary-light);
            transform: scale(1.05);
        }

        /* --- ОСНОВНОЙ КОНТЕНТ --- */
        #main-content {
            display: flex; 
            width: 100%;
            min-height: 100vh;
            opacity: 0;
            visibility: hidden;
            transition: opacity 3s ease-in;
            justify-content: center;
            align-items: flex-start; /* Изменено для корректного скролла */
            position: relative;
            z-index: 10;
            padding-bottom: 100px; /* Место снизу, чтобы игра не прилипала к краю */
        }
        
        .center-letter {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.03); 
            font-size: 16rem; 
            font-family: 'Cormorant Garamond', serif;
            font-weight: bold;
            opacity: 0;
            animation: fadeInLetter 4s forwards 1.5s, floatLetter 6s ease-in-out infinite alternate;
            z-index: 0; 
            pointer-events: none;
            text-shadow: 0 0 80px rgba(255, 154, 158, 0.15); 
        }

        @keyframes floatLetter {
            0% { text-shadow: 0 0 60px rgba(255, 154, 158, 0.1); }
            100% { text-shadow: 0 0 100px rgba(255, 154, 158, 0.3); }
        }

        .heart-bg-wrapper {
            position: fixed; 
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1; 
            animation: heartbeat 2.5s infinite; 
            pointer-events: none; 
        }

        .text-element {
            position: absolute;
            color: rgba(252, 234, 187, 0.2); 
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            transform: translate(-50%, -50%);
            animation: fadeIn 2s forwards;
            font-family: 'Montserrat', sans-serif;
            white-space: nowrap;
            letter-spacing: 1px;
        }

        .main-message-container {
            position: relative;
            z-index: 10; 
            text-align: center;
            padding: 8vh 20px 50px 20px;
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-text {
            color: #ffffff;
            font-size: 3.5rem;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 600;
            margin: 0 0 30px 0;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUp 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) 1s forwards;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 154, 158, 0.4);
            letter-spacing: 2px;
        }

        #typing-text {
            color: var(--primary-light);
            font-size: 1.25rem;
            line-height: 1.8; 
            font-weight: 400; 
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9), 0 0 10px rgba(252, 234, 187, 0.2);
            background: rgba(0, 0, 0, 0.2);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.05);
            max-width: 700px;
            min-height: 250px;
            text-align: left; /* Читать приятнее с левого края */
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background-color: var(--accent-glow);
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
            margin-left: 4px;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        /* --- МИНИ-ИГРА --- */
        #minigame-container {
            margin-top: 50px;
            opacity: 0;
            visibility: hidden;
            transition: all 1.5s ease-in;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.02);
            transform: translateY(20px);
            width: 100%;
            max-width: 600px;
        }

        .game-step {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .game-step.active {
            display: flex;
            animation: fadeInScale 0.8s forwards;
        }

        .game-question {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 35px;
            font-style: italic;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
        }

        .game-buttons {
            display: flex;
            gap: 20px;
            position: relative;
            min-height: 55px;
            width: 100%;
            justify-content: center;
        }

        .game-btn {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--primary-light);
            border: 1px solid rgba(252, 234, 187, 0.3);
            padding: 14px 35px;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .game-btn:hover {
            background-color: var(--primary-light);
            box-shadow: 0 0 20px rgba(252, 234, 187, 0.5);
            color: #000; 
            font-weight: 600;
            transform: translateY(-3px);
        }

        /* Полностью переработанная анимация убегания (работает через GPU) */
        .runaway-active {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
            will-change: transform; /* Подсказка браузеру для 60 FPS */
        }

        .final-message {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8rem;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5), 0 0 30px var(--accent-glow);
            animation: pulseFinal 2.5s infinite;
            text-align: center;
        }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes fadeInLetter { to { opacity: 0.8; } }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInScale { 
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            10% { transform: scale(1.02); }
            20% { transform: scale(1); }
            30% { transform: scale(1.02); }
        }

        @keyframes pulseFinal {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @media (max-width: 600px) {
            .main-text { font-size: 2.2rem; margin-top: 20px;}
            #typing-text { font-size: 1.05rem; padding: 20px; min-height: 200px; }
            .center-letter { font-size: 10rem; } 
            .intro-text { font-size: 1.4rem; padding: 0 15px;}
            .game-buttons { flex-direction: column; align-items: center; }
            .game-btn { width: 100%; max-width: 260px; }
            #minigame-container { padding: 25px 15px; margin-top: 30px;}
        }
    </style>
</head>
<body>

    <!-- Звездный фон -->
    <div id="starfield">
        <!-- Падающие звезды -->
        <div class="shooting-star" style="top: 10%; animation-delay: 2s;"></div>
        <div class="shooting-star" style="top: 30%; animation-delay: 6s;"></div>
    </div>

    <!-- СТАРТОВЫЙ ЭКРАН -->
    <div id="intro-screen">
        <div class="intro-text">Ань, при прочтении, пожалуйста, не суди строго, люблю.</div>
        <button id="start-btn" class="start-btn">открыть</button>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div id="main-content">
        <div class="center-letter">А</div>
        <div class="heart-bg-wrapper" id="heart-wrapper"></div>

        <div class="main-message-container">
            <h1 class="main-text">Моя любимая вселенная</h1>
            <div id="typing-text"></div>
            
            <!-- МИНИ-ИГРА -->
            <div id="minigame-container">
                <div id="step-1" class="game-step active">
                    <div class="game-question">Ты согласна?</div>
                    <div class="game-buttons">
                        <button class="game-btn" onclick="nextStep(2)">Да</button>
                        <button class="game-btn" id="runaway-1">Нет</button>
                    </div>
                </div>

                <div id="step-2" class="game-step">
                    <div class="game-question">Куда мы пойдём на свидание?</div>
                    <div class="game-buttons">
                        <button class="game-btn" onclick="nextStep(3)">Куда захочешь ты</button>
                        <button class="game-btn" id="runaway-2">Я лучше дома посижу</button>
                    </div>
                </div>

                <div id="step-3" class="game-step">
                    <div class="final-message">Тогда выходи, я тебя жду</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Генерация звездного неба
        function createStars() {
            const starfield = document.getElementById('starfield');
            const starCount = window.innerWidth < 600 ? 40 : 100;

            for (let i = 0; i < starCount; i++) {
                let star = document.createElement('div');
                star.className = 'star';
                let size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = (Math.random() * 3) + 's';
                starfield.appendChild(star);
            }
        }
        createStars();

        document.getElementById('start-btn').addEventListener('click', function() {
            const intro = document.getElementById('intro-screen');
            const mainContent = document.getElementById('main-content');

            intro.style.opacity = '0';
            
            setTimeout(() => {
                intro.style.visibility = 'hidden';
                mainContent.style.visibility = 'visible';
                mainContent.style.display = 'flex'; 
                
                setTimeout(() => {
                    mainContent.style.opacity = '1';
                    startAnimations(); 
                }, 100);
            }, 1500); 
        });

        function startAnimations() {
            const container = document.getElementById('heart-wrapper');
            const bgText = "I love you"; 
            let delay = 0;
            const heartScale = window.innerWidth < 600 ? 11 : 22;

            for (let t = 0; t < Math.PI * 2; t += 0.05) {
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                const el = document.createElement('div');
                el.className = 'text-element';
                el.innerText = bgText;
                el.style.left = `calc(50% + ${x * heartScale}px)`;
                el.style.top = `calc(50% + ${y * heartScale}px)`;
                el.style.animationDelay = `${delay}s`;
                delay += 0.03; 
                container.appendChild(el);
            }

            const textLines = [
                "Каждый день с тобой — это особенный подарок.",
                "Спасибо, что ты есть. Каждый день рядом с тобой наполнял меня чем-то большим, чем просто эмоции.",
                "Знаешь, уже довольно давно я хотел сказать тебе кое-что важное:",
                "Мы уже достаточно давно стали больше, чем просто друзьями. В такие моменты я не особо люблю говорить о себе, поэтому хочу рассказать о тебе.",
                "Иногда я задумываюсь: «Как всё это началось?» Всё началось в тот момент, когда я увидел тебя и твою заботу.",
                "Раньше ты всегда была более шутлива, но в какой-то момент стала такой мягкой, доброй и искренней.",
                "Ты всегда была невероятно красивой, и на самом деле с каждым днём я вижу тебя ещё красивей.",
                "В общем, я не хочу как-то медлить или тянуть это всё. Я долго не мог подобрать правильных слов лично, но здесь у меня достаточно времени.",
                "Ань, будь моей девушкой. Я просто хочу, чтобы весь мир услышал о моих чувствах к тебе."
            ];

            const typingContainer = document.getElementById('typing-text');
            let lineIdx = 0;
            let charIdx = 0;
            let currentSpan = null;
            const cursor = document.createElement('span');
            cursor.className = 'cursor';

            function typeWriter() {
                if (lineIdx < textLines.length) {
                    const currentStr = textLines[lineIdx];

                    if (charIdx === 0) {
                        currentSpan = document.createElement('span');
                        typingContainer.appendChild(currentSpan);
                        typingContainer.appendChild(cursor);
                    }

                    if (charIdx < currentStr.length) {
                        currentSpan.textContent += currentStr.charAt(charIdx);
                        charIdx++;
                        let speed = Math.random() * 25 + 25; 
                        setTimeout(typeWriter, speed);
                    } else {
                        typingContainer.insertBefore(document.createElement('br'), cursor);
                        if (lineIdx < textLines.length - 1) {
                            typingContainer.insertBefore(document.createElement('br'), cursor);
                        }
                        lineIdx++;
                        charIdx = 0;
                        
                        // АВТОСКРОЛЛ: плавно спускаем страницу, если текст уходит вниз
                        window.scrollTo({
                            top: document.body.scrollHeight,
                            behavior: 'smooth'
                        });

                        setTimeout(typeWriter, 600); 
                    }
                } else {
                    cursor.style.display = 'none'; 
                    setTimeout(() => {
                        const gameContainer = document.getElementById('minigame-container');
                        gameContainer.style.visibility = 'visible';
                        gameContainer.style.opacity = '1';
                        gameContainer.style.transform = 'translateY(0)';
                        
                        setTimeout(() => {
                            gameContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }, 200);
                    }, 1000);
                }
            }

            setTimeout(typeWriter, 2500);
        }

        function nextStep(stepNumber) {
            document.querySelectorAll('.game-step').forEach(el => el.classList.remove('active'));
            document.getElementById('step-' + stepNumber).classList.add('active');
        }

        // --- Идеально плавная анимация через transform (GPU) ---
        function makeButtonRunaway(buttonId) {
            const btn = document.getElementById(buttonId);
            let isDetached = false;

            const triggerRunaway = () => {
                if (!isDetached) {
                    // Создаем прозрачную копию на месте кнопки, чтобы верстка не прыгала
                    const placeholder = document.createElement('div');
                    placeholder.style.width = btn.offsetWidth + 'px';
                    placeholder.style.height = btn.offsetHeight + 'px';
                    btn.parentNode.insertBefore(placeholder, btn);
                    
                    // Узнаем реальные координаты кнопки на экране
                    const rect = btn.getBoundingClientRect();
                    
                    // Отвязываем кнопку, но визуально оставляем ее ровно на том же месте с помощью transform
                    btn.style.width = rect.width + 'px';
                    btn.style.height = rect.height + 'px';
                    btn.style.position = 'fixed';
                    btn.style.left = '0px'; 
                    btn.style.top = '0px';
                    btn.style.transform = `translate(${rect.left}px, ${rect.top}px)`;
                    btn.style.zIndex = '9999';
                    
                    isDetached = true;
                    
                    // Микрозадержка, чтобы браузер применил стили, а потом мы включаем плавность
                    setTimeout(() => {
                        btn.classList.add('runaway-active');
                        moveButton();
                    }, 50);
                } else {
                    moveButton();
                }
            };

            const moveButton = () => {
                const maxX = window.innerWidth - btn.offsetWidth - 30;
                const maxY = window.innerHeight - btn.offsetHeight - 30;
                
                const randomX = Math.max(20, Math.floor(Math.random() * maxX));
                const randomY = Math.max(20, Math.floor(Math.random() * maxY));
                
                // Добавляем игривое вращение при перемещении
                const randomRotate = Math.floor(Math.random() * 40) - 20; 
                
                // Двигаем кнопку только через transform — это дает 60 FPS
                btn.style.transform = `translate(${randomX}px, ${randomY}px) rotate(${randomRotate}deg) scale(0.9)`;
                
                setTimeout(() => {
                    btn.style.transform = `translate(${randomX}px, ${randomY}px) rotate(${randomRotate}deg) scale(1)`;
                }, 150);
            };

            btn.addEventListener('mouseover', triggerRunaway);
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault(); 
                triggerRunaway();
            });
        }

        makeButtonRunaway('runaway-1');
        makeButtonRunaway('runaway-2');

    </script>
</body>
</html>
